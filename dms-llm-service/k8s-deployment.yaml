apiVersion: apps/v1
kind: Deployment
metadata:
  name: dms-llm-service
  labels:
    app: dms-llm-service
    service: llm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dms-llm-service
  template:
    metadata:
      labels:
        app: dms-llm-service
        service: llm
    spec:
      containers:
      - name: dms-llm-service
        image: dms-llm-service:latest
        ports:
        - containerPort: 8085
        env:
        - name: PORT
          value: "8085"
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: dms-config
              key: environment
        - name: azure-ai-search-endpoint
          valueFrom:
            secretKeyRef:
              name: dms-secrets
              key: azure-ai-search-endpoint
        - name: azure-ai-search-api-key
          valueFrom:
            secretKeyRef:
              name: dms-secrets
              key: azure-ai-search-api-key
        - name: azure-openai-endpoint
          valueFrom:
            secretKeyRef:
              name: dms-secrets
              key: azure-openai-endpoint
        - name: azure-openai-api-key
          valueFrom:
            secretKeyRef:
              name: dms-secrets
              key: azure-openai-api-key
        - name: AUDIT_SERVICE_URL
          value: "http://dms-audit-service:8082"
        - name: DOCUMENT_SERVICE_URL
          value: "http://dms-document-service:8083"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8085
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8085
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            memory: "1Gi"
            cpu: "1000m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
---
apiVersion: v1
kind: Service
metadata:
  name: dms-llm-service
  labels:
    app: dms-llm-service
spec:
  type: ClusterIP
  ports:
  - port: 8085
    targetPort: 8085
    protocol: TCP
    name: http
  selector:
    app: dms-llm-service
