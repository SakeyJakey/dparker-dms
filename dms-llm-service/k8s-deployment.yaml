apiVersion: apps/v1
kind: Deployment
metadata:
  name: dms-llm-service
  namespace: dms-dev
  labels:
    app: dms-llm-service
    service: llm
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dms-llm-service
  template:
    metadata:
      labels:
        app: dms-llm-service
        service: llm
        version: v1
    spec:
      serviceAccountName: dms-llm-service
      containers:
      - name: dms-llm-service
        image: dms-llm-service:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: PORT
          value: "8080"
        - name: SERVER_PORT
          value: "8080"
        - name: ENVIRONMENT
          value: dev
        - name: SPRING_PROFILES_ACTIVE
          value: dev
        - name: AZURE_AI_SEARCH_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: dms-secrets
              key: azure-ai-search-endpoint
        - name: AZURE_AI_SEARCH_API_KEY
          valueFrom:
            secretKeyRef:
              name: dms-secrets
              key: azure-ai-search-api-key
        - name: AZURE_OPENAI_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: dms-secrets
              key: azure-openai-endpoint
        - name: AZURE_OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: dms-secrets
              key: azure-openai-api-key
        - name: AUDIT_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: dms-service-urls-configmap
              key: audit.service
        - name: DOCUMENT_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: dms-service-urls-configmap
              key: document.service
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "1Gi"
            cpu: "1000m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
---
apiVersion: v1
kind: Service
metadata:
  name: dms-llm-service
  namespace: dms-dev
  labels:
    app: dms-llm-service
    service: llm
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  selector:
    app: dms-llm-service
