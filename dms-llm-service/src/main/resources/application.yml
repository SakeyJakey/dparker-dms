spring:
  application:
    name: dms-llm-service
  
  cloud:
    azure:
      keyvault:
        secret:
          property-sources:
            - name: dms-keyvault
              endpoint: https://dms-keyvault-${ENVIRONMENT:dev}.vault.azure.net

server:
  port: ${PORT:8085}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

azure:
  ai:
    search:
      endpoint: ${azure-ai-search-endpoint:}
      api-key: ${azure-ai-search-api-key:}
    openai:
      endpoint: ${azure-openai-endpoint:}
      api-key: ${azure-openai-api-key:}

# Service URLs for inter-service communication
dms:
  services:
    audit-service-url: ${AUDIT_SERVICE_URL:http://dms-audit-service:8082}
    document-service-url: ${DOCUMENT_SERVICE_URL:http://dms-document-service:8083}

logging:
  level:
    root: INFO
    com.davidparker.dms.llm: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
