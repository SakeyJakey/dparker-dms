apiVersion: apps/v1
kind: Deployment
metadata:
  name: dms-frontend-service
  labels:
    app: dms-frontend-service
    service: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dms-frontend-service
  template:
    metadata:
      labels:
        app: dms-frontend-service
        service: frontend
    spec:
      containers:
      - name: dms-frontend-service
        image: dms-frontend-service:latest
        ports:
        - containerPort: 80
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: dms-frontend-service
  labels:
    app: dms-frontend-service
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: dms-frontend-service
