apiVersion: apps/v1
kind: Deployment
metadata:
  name: dms-frontend-service
  namespace: dms-dev-frontend
  labels:
    app: dms-frontend-service
    service: frontend
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dms-frontend-service
  template:
    metadata:
      labels:
        app: dms-frontend-service
        service: frontend
        version: v1
    spec:
      containers:
      - name: dms-frontend-service
        image: dms-frontend-service:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: APIGATEWAY_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: dms-service-urls-configmap
              key: apigateway.service
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: dms-frontend-service
  namespace: dms-dev-frontend
  labels:
    app: dms-frontend-service
    service: frontend
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  selector:
    app: dms-frontend-service
