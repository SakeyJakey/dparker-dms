apiVersion: apps/v1
kind: Deployment
metadata:
  name: dms-compliance-service
  namespace: dms-dev
  labels:
    app: dms-compliance-service
    service: compliance
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dms-compliance-service
  template:
    metadata:
      labels:
        app: dms-compliance-service
        service: compliance
        version: v1
    spec:
      serviceAccountName: dms-compliance-service
      containers:
      - name: dms-compliance-service
        image: dms-compliance-service:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: PORT
          value: "8080"
        - name: SERVER_PORT
          value: "8080"
        - name: ENVIRONMENT
          value: dev
        - name: SPRING_PROFILES_ACTIVE
          value: dev
        - name: AUDIT_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: dms-service-urls-configmap
              key: audit.service
        - name: DOCUMENT_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: dms-service-urls-configmap
              key: document.service
        - name: ADMIN_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: dms-service-urls-configmap
              key: admin.service
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: dms-compliance-service
  namespace: dms-dev
  labels:
    app: dms-compliance-service
    service: compliance
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  selector:
    app: dms-compliance-service
