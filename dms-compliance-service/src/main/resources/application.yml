spring:
  application:
    name: dms-compliance-service
  
  cloud:
    azure:
      keyvault:
        secret:
          property-sources:
            - name: dms-keyvault
              endpoint: https://dms-keyvault-${ENVIRONMENT:dev}.vault.azure.net

server:
  port: ${PORT:8084}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Service URLs for inter-service communication
dms:
  services:
    audit-service-url: ${AUDIT_SERVICE_URL:http://dms-audit-service:8082}
    document-service-url: ${DOCUMENT_SERVICE_URL:http://dms-document-service:8083}
    admin-service-url: ${ADMIN_SERVICE_URL:http://dms-admin-service:8081}

logging:
  level:
    root: INFO
    com.davidparker.dms.compliance: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
