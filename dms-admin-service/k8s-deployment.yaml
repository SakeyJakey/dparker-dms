apiVersion: apps/v1
kind: Deployment
metadata:
  name: dms-admin-service
  labels:
    app: dms-admin-service
    service: admin
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dms-admin-service
  template:
    metadata:
      labels:
        app: dms-admin-service
        service: admin
    spec:
      containers:
      - name: dms-admin-service
        image: dms-admin-service:latest
        ports:
        - containerPort: 8081
        env:
        - name: PORT
          value: "8081"
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: dms-config
              key: environment
        - name: database-connection-string
          valueFrom:
            secretKeyRef:
              name: dms-secrets
              key: admin-db-connection-string
        - name: redis-host
          valueFrom:
            configMapKeyRef:
              name: dms-config
              key: redis-host
        - name: AUDIT_SERVICE_URL
          value: "http://dms-audit-service:8082"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: dms-admin-service
  labels:
    app: dms-admin-service
spec:
  type: ClusterIP
  ports:
  - port: 8081
    targetPort: 8081
    protocol: TCP
    name: http
  selector:
    app: dms-admin-service
