# Development profile - local development with H2, no Azure
spring:
  autoconfigure:
    exclude:
      - com.azure.spring.cloud.autoconfigure.implementation.keyvault.secrets.AzureKeyVaultSecretAutoConfiguration
      - com.azure.spring.cloud.autoconfigure.implementation.storage.blob.AzureBlobStorageAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  cloud:
    azure:
      keyvault:
        secret:
          enabled: false

  datasource:
    url: jdbc:h2:mem:dms_admin;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

server:
  port: 8081

dms:
  services:
    audit-service-url: ${AUDIT_SERVICE_URL:http://localhost:8082}
    document-service-url: ${DOCUMENT_SERVICE_URL:http://localhost:8083}

# Bypass authentication in dev mode
security:
  bypass-auth: true

logging:
  level:
    com.davidparker.dms.admin: DEBUG
    org.springframework.security: DEBUG
