# Docker Compose profile - PostgreSQL locally, no Azure
spring:
  autoconfigure:
    exclude:
      - com.azure.spring.cloud.autoconfigure.implementation.keyvault.secrets.AzureKeyVaultSecretAutoConfiguration
      - com.azure.spring.cloud.autoconfigure.implementation.storage.blob.AzureBlobStorageAutoConfiguration

  cloud:
    azure:
      keyvault:
        secret:
          enabled: false

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-admin:5432/dms_admin}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

server:
  port: 8081

dms:
  services:
    audit-service-url: ${AUDIT_SERVICE_URL:http://dms-audit-service:8082}
    document-service-url: ${DOCUMENT_SERVICE_URL:http://dms-document-service:8083}

# Bypass authentication in docker mode for local testing
security:
  bypass-auth: true

logging:
  level:
    com.davidparker.dms.admin: DEBUG
