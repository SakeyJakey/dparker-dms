spring:
  application:
    name: dms-admin-service

  cloud:
    azure:
      keyvault:
        secret:
          enabled: false
  profiles:
    default: dev

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dms_admin}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: ${redis-host:localhost}
      port: ${redis-port:6379}
      password: ${redis-password:}
      timeout: 2000ms

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Service URLs for inter-service communication
dms:
  services:
    audit-service-url: ${AUDIT_SERVICE_URL:http://dms-audit-service:8080}
    document-service-url: ${DOCUMENT_SERVICE_URL:http://dms-document-service:8080}

# Azure AD Configuration
azure:
  tenant-id: ${AZURE_TENANT_ID:}
  client-id: ${AZURE_CLIENT_ID:}
  jwk-set-uri: ${AZURE_JWK_SET_URI:}

logging:
  level:
    root: INFO
    com.davidparker.dms.admin: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
