apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: dms-api-gateway-service-internal
  namespace: dms-uat
spec:
  hosts:
    - "dms.uat.lvad.lvfs.net"
  gateways:
    - istio-ingress-internal/default-gateway-uat-internal
  http:
    # Route API calls from frontend to API Gateway
    - match:
        - uri:
            prefix: "/api"
      route:
        - destination:
            host: dms-api-gateway-service.dms-uat.svc.cluster.local
            port:
              number: 8080
      timeout: 120s
      retries:
        attempts: 3
        perTryTimeout: 10s
      corsPolicy:
        allowOrigins:
          - exact: https://dms.uat.lvad.lvfs.net
        allowMethods:
          - POST
          - GET
          - OPTIONS
          - PATCH
          - PUT
          - DELETE
        allowHeaders:
          - Authorization
          - Content-Type
          - Accept
          - Origin
          - User-Agent
        allowCredentials: true
