apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: dms-services
  namespace: dms-system
spec:
  hosts:
    - dms-admin-service
    - dms-document-service
    - dms-audit-service
    - dms-compliance-service
    - dms-llm-service
    - dms-frontend-service
  http:
    - match:
        - uri:
            prefix: "/api/v1"
      route:
        - destination:
            host: dms-admin-service
            port:
              number: 8081
          weight: 100
      timeout: 30s
      retries:
        attempts: 3
        perTryTimeout: 10s
      fault:
        delay:
          percentage:
            value: 0.1
          fixedDelay: 5s
      corsPolicy:
        allowOrigins:
          - exact: "*"
        allowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        allowHeaders:
          - "*"
        maxAge: 24h
