apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dms-services-uat
  namespace: flux-system
spec:
  interval: 5m
  path: ./clusters/uat
  prune: true
  sourceRef:
    kind: GitRepository
    name: dms-config
  validation: client
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: dms-admin-service
      namespace: dms-uat
    - apiVersion: apps/v1
      kind: Deployment
      name: dms-document-service
      namespace: dms-uat
    - apiVersion: apps/v1
      kind: Deployment
      name: dms-audit-service
      namespace: dms-uat
    - apiVersion: apps/v1
      kind: Deployment
      name: dms-compliance-service
      namespace: dms-uat
    - apiVersion: apps/v1
      kind: Deployment
      name: dms-llm-service
      namespace: dms-uat
    - apiVersion: apps/v1
      kind: Deployment
      name: dms-frontend-service
      namespace: dms-uat-frontend
