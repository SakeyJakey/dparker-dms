# Development profile - local development with H2
spring:
  autoconfigure:
    exclude:
      - com.azure.spring.cloud.autoconfigure.implementation.storage.blob.AzureBlobStorageAutoConfiguration
  datasource:
    url: jdbc:h2:mem:dms_document;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  cloud:
    azure:
      keyvault:
        secret:
          enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

server:
  port: 8083

dms:
  storage:
    blob:
      use-development-storage: true

# Bypass authentication in dev mode
security:
  bypass-auth: true

logging:
  level:
    com.davidparker.dms.document: DEBUG
    org.springframework.security: DEBUG
