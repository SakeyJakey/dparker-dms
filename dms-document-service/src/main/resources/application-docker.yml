# Docker Compose profile
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-document:5432/dms_document}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

server:
  port: 8083

# Bypass authentication in docker mode for local testing
security:
  bypass-auth: true

logging:
  level:
    com.davidparker.dms.document: DEBUG
