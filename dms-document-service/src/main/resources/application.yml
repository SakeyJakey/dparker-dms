spring:
  application:
    name: dms-document-service
  
  cloud:
    azure:
      keyvault:
        secret:
          enabled: false
      storage:
        blob:
          connection-string: ${AZURE_STORAGE_CONNECTION_STRING:}
          account-name: ${AZURE_STORAGE_ACCOUNT_NAME:dmsstoragedev}
          account-key: ${storage-account-key-davidparker-lv-bmth:}
  profiles:
    default: dev
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dms_document}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}
  error:
    include-message: always

spring.servlet.multipart:
  max-file-size: 100MB
  max-request-size: 105MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

dms:
  storage:
    blob:
      use-development-storage: false
  services:
    admin-service-url: ${ADMIN_SERVICE_URL:http://dms-admin-service:8080}
    audit-service-url: ${AUDIT_SERVICE_URL:http://dms-audit-service:8080}
    llm-service-url: ${LLM_SERVICE_URL:http://dms-llm-service:8080}

logging:
  level:
    root: INFO
    com.davidparker.dms.document: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
