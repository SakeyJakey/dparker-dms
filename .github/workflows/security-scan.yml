name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0' # Weekly scan

jobs:
  maven-security-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [admin-service, document-service, audit-service, compliance-service, llm-service]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Run OWASP Dependency Check
        working-directory: dms-${{ matrix.service }}
        run: |
          mvn org.owasp:dependency-check-maven:check
      - name: Upload OWASP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-report-${{ matrix.service }}
          path: dms-${{ matrix.service }}/target/dependency-check-report.html

  npm-security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: dms-frontend-service
        run: npm ci
      - name: Run npm audit
        working-directory: dms-frontend-service
        run: |
          npm audit --audit-level=moderate || exit 1
      - name: Check for CVEs
        working-directory: dms-frontend-service
        run: |
          if npm audit --json | jq '.vulnerabilities | length' | grep -v '^0$'; then
            echo "CVEs detected! Build failed."
            exit 1
          fi

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container images
        run: |
          docker build -t dms-admin-service:test dms-admin-service/
          docker build -t dms-document-service:test dms-document-service/
          docker build -t dms-audit-service:test dms-audit-service/
          docker build -t dms-compliance-service:test dms-compliance-service/
          docker build -t dms-llm-service:test dms-llm-service/
          docker build -t dms-frontend-service:test dms-frontend-service/
      - name: Scan containers with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'dms-admin-service:test'
          format: 'sarif'
          output: 'trivy-results.sarif'
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
