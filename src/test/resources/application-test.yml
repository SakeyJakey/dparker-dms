spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

azure:
  storage:
    account-key: test-key
  ai:
    search:
      endpoint: http://localhost:8080
      api-key: test-key
    openai:
      endpoint: http://localhost:8080
      api-key: test-key
