apiVersion: apps/v1
kind: Deployment
metadata:
  name: dms-audit-service
  namespace: dms-dev
  labels:
    app: dms-audit-service
    service: audit
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dms-audit-service
  template:
    metadata:
      labels:
        app: dms-audit-service
        service: audit
        version: v1
    spec:
      serviceAccountName: dms-audit-service
      containers:
      - name: dms-audit-service
        image: dms-audit-service:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: PORT
          value: "8080"
        - name: SERVER_PORT
          value: "8080"
        - name: SPRING_PROFILES_ACTIVE
          value: prod
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            secretKeyRef:
              name: dms-secrets
              key: database-url
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: dms-secrets
              key: db-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dms-secrets
              key: db-password
        - name: AZURE_TENANT_ID
          valueFrom:
            configMapKeyRef:
              name: dms-azure-configmap
              key: AZURE_TENANT_ID
        - name: AZURE_CLIENT_ID
          valueFrom:
            configMapKeyRef:
              name: dms-azure-configmap
              key: AZURE_CLIENT_ID
        - name: AZURE_JWK_SET_URI
          valueFrom:
            configMapKeyRef:
              name: dms-azure-configmap
              key: AZURE_JWK_SET_URI
        - name: EVENT_HUBS_CONNECTION_STRING
          valueFrom:
            secretKeyRef:
              name: dms-secrets
              key: event-hubs-connection-string
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: dms-audit-service
  namespace: dms-dev
  labels:
    app: dms-audit-service
    service: audit
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  selector:
    app: dms-audit-service
