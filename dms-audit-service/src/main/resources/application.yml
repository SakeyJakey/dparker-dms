spring:
  application:
    name: dms-audit-service
  
  profiles:
    default: dev
  cloud:
    azure:
      keyvault:
        secret:
          enabled: false
          # property-sources:
          #   - name: dms-keyvault
          #     endpoint: https://dms-keyvault-${ENVIRONMENT:dev}.vault.azure.net
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dms_audit}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

azure:
  tenant-id: ${AZURE_TENANT_ID:}
  client-id: ${AZURE_CLIENT_ID:}
  jwk-set-uri: ${AZURE_JWK_SET_URI:}
  event-hubs:
    connection-string: ${event-hubs-connection-string:}
    hub-name: audit-logs

logging:
  level:
    root: INFO
    com.davidparker.dms.audit: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
